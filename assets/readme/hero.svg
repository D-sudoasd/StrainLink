<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">StrainLink</title>
  <desc id="desc">Synchrotron in-situ tensile data mapping tool. Fill missing stress or strain using a reference curve.</desc>
  <rect width="1200" height="360" rx="26" fill="#F1EBE2"/>
  <rect x="0" y="0" width="16" height="360" fill="#C45C20"/>
  <path d="M0 56H1200" stroke="#D8D0C4"/>
  <g transform="translate(56 44)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text fill="#5E5850" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2.2">IN-SITU SXRD · TENSILE DATA MAPPING</text>
    <text y="96" fill="#14120F" font-size="48" font-weight="780" letter-spacing="-1.6">StrainLink</text>
    <text y="144" fill="#3A3630" font-size="22">Map missing stress or strain from a reference curve.</text>
    <path d="M0 172H500" stroke="#C8C0B4"/>
    <g transform="translate(0 208)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
      <text fill="#14120F">PCHIP</text>
      <text x="84" fill="#5E5850">STRAIN-ONLY</text>
      <text x="212" fill="#5E5850">STRESS-ONLY</text>
      <text x="348" fill="#C45C20">BOTH</text>
    </g>
    <text y="270" fill="#7A7468" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">one row = one spectrum/frame · MIT</text>
  </g>
  <g transform="translate(720 48)">
    <rect width="420" height="264" fill="#14120F"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <text x="24" y="36" fill="#8A7A68" font-size="12">REFERENCE σ–ε · STATION MAP</text>
      <polyline points="36,210 80,200 120,178 160,145 200,118 240,98 280,86 320,80 360,76" fill="none" stroke="#E8844A" stroke-width="2.6"/>
      <circle cx="160" cy="145" r="5" fill="#6EC1FF"/>
      <circle cx="240" cy="98" r="5" fill="#6EC1FF"/>
      <circle cx="300" cy="83" r="5" fill="#6EC1FF"/>
      <text x="24" y="70" fill="#C8C0B4" font-size="13">interpolate · inverse · units · export</text>
      <text x="24" y="248" fill="#6A6458" font-size="11">publication plot presets · Tk GUI</text>
    </g>
  </g>
  <text x="1144" y="336" text-anchor="end" fill="#8A8478" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">D-sudoasd / StrainLink</text>
</svg>
